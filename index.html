<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دروازهٔ مسی — Coppergate</title>
<meta name="description" content="بازی وسترن دو‌بعدی در دنیای باز — شهر کوپرگیت">
<link rel="stylesheet" href="./css/style.css">
<script>
/* گارد بوت زودهنگام: هر خطای ماژول به یک پنل فارسیِ قابل‌مشاهده می‌رسد. */
window.__cgErrors = [];
window.addEventListener('error', function (e) {
  var msg = (e && (e.message || e.type)) ? String(e.message || e.type) : String(e);
  window.__cgErrors.push(msg);
  var p = document.getElementById('boot-error');
  if (p && p.hidden) {
    p.hidden = false;
    var d = p.querySelector('.detail');
    if (d) d.textContent = window.__cgErrors.join('\n');
  }
});
window.addEventListener('unhandledrejection', function (e) {
  var msg = e && e.reason ? String(e.reason && e.reason.message || e.reason) : 'promise rejection';
  window.__cgErrors.push(msg);
});
</script>
</head>
<body>
<div id="game"></div>

<div id="loading">
  <div class="box">
    <div class="title">دروازهٔ مسی</div>
    <div class="bar"><i></i></div>
    <div class="msg">در حال آماده‌سازی شهر…</div>
  </div>
</div>

<div id="boot-error" hidden>
  <div class="box">
    <div class="title">خطا در راه‌اندازی بازی</div>
    <p>متأسفانه «دروازهٔ مسی» نتوانست اجرا شود. لطفاً صفحه را دوباره بارگذاری کنید و اگر خطا تکرار شد از مرورگر به‌روزشده استفاده کنید.</p>
    <pre class="detail"></pre>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
