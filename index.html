<title>Dusty Hollow — نسخهٔ ۲</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&family=Rye&display=swap">
<style>
:root{color-scheme:dark;--bg:#0f0905;--ink:#1d130b;--paper:#ead9b0;--paper2:#d6c08c;--paperD:#b99d62;--rust:#b23a22;--rust2:#7d2414;--gold:#e5b44f;--gold2:#a9801f;--glass:rgba(20,12,6,.78);--glass2:rgba(34,22,12,.9);--ok:#8dbb62;--bad:#e2604a;--blue:#68b4d8;--fg:#f1e3bf;--mute:#a8956b;--font:"Vazirmatn","Segoe UI",Tahoma,"Noto Sans Arabic","DejaVu Sans",sans-serif;--logo:"Rye","Rockwell","Georgia",serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--font)}
body{padding:0!important}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0f08 0%,#0b0603 100%);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:center center;background:#000;box-shadow:0 0 60px rgba(0,0,0,.8);user-select:none;-webkit-user-select:none;touch-action:none}
#cv{position:absolute;inset:0;width:1280px;height:720px;display:block;background:#2a2018}
#ui{position:absolute;inset:0;direction:rtl;pointer-events:none;font-size:15px;line-height:1.5}
#stage.playing{cursor:none}
#ui button,#ui .panel,#ui input,#ui select,#ui .clickable{pointer-events:auto}
.hud{position:absolute;inset:0;transition:opacity .4s}
.hud.off{opacity:0}
.tx{text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8)}
/* top left */
#hTL{position:absolute;left:auto;right:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.money{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700;color:var(--gold);text-shadow:0 2px 0 #000,0 0 10px rgba(0,0,0,.7);direction:ltr}
.money i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe58a,#d19a22 60%,#7d5a10);box-shadow:0 0 0 2px #4a3410,0 2px 4px #000}
.bounty{background:linear-gradient(#8e2a18,#5e170b);border:2px solid #d9a55a;color:#ffe9b8;padding:2px 12px;font-weight:700;font-size:14px;border-radius:3px;letter-spacing:.2px;animation:pulseB 1.6s infinite}
@keyframes pulseB{50%{box-shadow:0 0 14px #e04a2a}}
.honor{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--paper2)}
.hbar{position:relative;width:110px;height:6px;background:#1a110a;border:1px solid #6b5230;border-radius:3px}
.hbar i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--ok);border-radius:2px;transition:all .4s}
.hbar b{position:absolute;left:50%;top:-3px;width:1px;height:12px;background:#d9c28a}
#hPing{font-size:13px;font-weight:700;opacity:0;transition:opacity .4s}
#hPing.show{opacity:1}
/* top right: map */
#hTR{position:absolute;left:22px;top:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#miniWrap{position:relative;width:168px;height:168px}
#mini{position:absolute;inset:0;width:168px;height:168px;border-radius:50%;box-shadow:0 0 0 3px #3a2814,0 0 0 5px #b99d62,0 4px 12px rgba(0,0,0,.7)}
#hClock{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--paper);background:var(--glass);padding:3px 10px;border:1px solid #5a4226;border-radius:3px}
#hLoc{font-size:13px;color:var(--gold);font-weight:700;max-width:230px}
/* bottom left bars */
#hBL{position:absolute;left:24px;bottom:22px;display:flex;flex-direction:column;gap:7px;width:250px}
.bar{position:relative;height:13px;background:rgba(15,9,4,.75);border:2px solid #5a4226;border-radius:2px;overflow:hidden;direction:ltr}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transition:width .12s linear}
.bar.hp i{background:linear-gradient(#e0553d,#912a1a)}
.bar.st i{background:linear-gradient(#a6cf68,#5e8a2a)}
.bar.de i{background:linear-gradient(#f2cf74,#b07f1c)}
.bar.hp.low{animation:lowhp .7s infinite}
@keyframes lowhp{50%{border-color:#ff5a3a}}
.bar span{position:absolute;right:6px;top:-3px;font-size:10px;color:#f4e8c6;opacity:.85;text-shadow:0 1px 0 #000;font-weight:700}
.bar.de.ready{box-shadow:0 0 12px #e8be4a}
.lbl{font-size:10px;color:var(--paper2);letter-spacing:.4px;margin-bottom:-4px;direction:rtl}
/* weapon */
#hBR{position:absolute;right:24px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#hWpn{background:var(--glass);border:2px solid #5a4226;padding:6px 14px;min-width:210px;border-radius:3px;text-align:right;transition:transform .15s,border-color .15s}
#hWpn.flash{transform:scale(1.07);border-color:var(--gold)}
#hWpn .wn{font-size:14px;color:var(--paper)}
#hWpn .am{font-size:30px;font-weight:700;color:var(--gold);direction:ltr;text-align:right;line-height:1.1}
#hWpn .am small{font-size:15px;color:var(--paper2);margin-left:6px}
#hWpn .rl{height:3px;background:#1a110a;margin-top:3px}
#hWpn .rl i{display:block;height:100%;background:var(--ok);width:0}
#hSlots{display:flex;gap:5px;direction:ltr}
.slot{width:34px;height:34px;border:2px solid #4c3a22;background:var(--glass);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mute);position:relative;border-radius:3px}
.slot.has{color:var(--paper);border-color:#7d6338}
.slot.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(229,180,79,.5)}
.slot b{position:absolute;left:3px;top:0;font-size:9px;color:var(--paperD)}
#hItems{display:flex;gap:10px;font-size:12px;color:var(--paper2);direction:rtl}
#hItems span{background:var(--glass);padding:1px 8px;border:1px solid #4c3a22;border-radius:3px}
kbd,.kbd{display:inline-block;min-width:22px;padding:0 6px;text-align:center;background:#e6d4a4;color:#2a1a0c;border-radius:3px;border-bottom:3px solid #8e7440;font-family:var(--font);font-weight:700;font-size:13px;direction:ltr;line-height:20px}
/* prompt */
#hPrompt{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transition:opacity .15s}
#hPrompt.show{opacity:1}
#hPrompt .pt{background:var(--glass2);border:2px solid #7d6338;padding:4px 16px;border-radius:3px;font-size:16px;display:flex;gap:10px;align-items:center;color:var(--paper)}
#hPrompt .pb{width:160px;height:5px;background:#1a110a;border:1px solid #7d6338;display:none}
#hPrompt .pb i{display:block;height:100%;background:var(--gold);width:0}
#hPrompt.hold .pb{display:block}
/* objective */
#hObj{position:absolute;right:22px;top:128px;width:290px;background:linear-gradient(90deg,rgba(18,11,5,.0),rgba(18,11,5,.72) 25%);padding:6px 12px 6px 6px;border-right:3px solid var(--gold);border-radius:2px;transition:background .6s}
#hObj .oc{font-size:11px;color:var(--gold);letter-spacing:.3px;font-weight:700}
#hObj .ot{font-size:15px;color:var(--paper);line-height:1.55}
#hObj.new{background:rgba(122,84,20,.7)}
/* hint */
#hHint{position:absolute;left:50%;top:26px;transform:translateX(-50%) translateY(-20px);background:var(--glass2);border:2px solid #6b5230;padding:8px 22px;border-radius:3px;font-size:15px;opacity:0;transition:all .5s;max-width:760px;text-align:center;color:var(--paper)}
#hHint.show{opacity:1;transform:translateX(-50%)}
#hHint b{color:var(--gold)}
/* toasts */
#hToasts{position:absolute;left:24px;top:210px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;width:340px;direction:rtl}
.toast{background:var(--glass2);border-right:4px solid var(--paperD);padding:5px 14px;font-size:14px;border-radius:2px;animation:tIn .3s;max-width:100%;color:var(--paper)}
.toast.good{border-color:var(--ok)}.toast.bad{border-color:var(--bad);color:#ffd8cf}
.toast.out{opacity:0;transform:translateX(-30px);transition:all .5s}
@keyframes tIn{from{opacity:0;transform:translateX(-30px)}}
#hPick{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;flex-direction:column;gap:2px;align-items:center;font-size:15px;color:var(--gold)}
#hPick div{animation:pk 1.8s forwards;text-shadow:0 1px 0 #000,0 0 6px #000}
@keyframes pk{0%{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
/* duel */
#duel{position:absolute;left:0;right:0;top:120px;text-align:center;font-size:44px;font-weight:900;color:#f2e2b0;text-shadow:0 3px 0 #000,0 0 22px #000;letter-spacing:1px;pointer-events:none}
#duel.go{font-size:110px;color:#ff4a2a;animation:goP .25s}
#duel.bad{color:#ff6a4a}
@keyframes goP{from{transform:scale(2);opacity:0}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:30}
#fade.on{opacity:1;pointer-events:auto}
#autosv{position:absolute;right:26px;bottom:200px;font-size:12px;color:var(--paper2);opacity:0;transition:opacity .5s}
#autosv.show{opacity:.9}
/* dialogue */
#dlg{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);width:900px;display:none;z-index:12}
#dlg.show{display:flex;pointer-events:auto;animation:dIn .3s}
@keyframes dIn{from{opacity:0;transform:translate(-50%,20px)}}
#dlg .port{width:150px;height:170px;margin-left:-14px;flex:none;border:4px solid #3a2814;border-radius:3px;background:#2a1c10;position:relative;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.7);z-index:2;order:0}
#dlg .port canvas{width:100%;height:100%;display:block}
#dlg .box{flex:1;background:linear-gradient(#efe0b8,#dcc794);color:var(--ink);border:4px solid #3a2814;border-radius:3px;padding:12px 26px 12px 18px;min-height:130px;box-shadow:0 6px 18px rgba(0,0,0,.7);position:relative;order:1;margin-top:20px;cursor:pointer;display:flex;flex-direction:column}
#dlg .nm{font-weight:900;font-size:17px;color:var(--rust2);margin-bottom:2px;letter-spacing:.3px;position:absolute;top:-22px;right:22px;background:#3a2814;color:#f0d9a0;padding:1px 16px;border-radius:3px 3px 0 0}
#dlg .tx2{font-size:18px;line-height:1.85;min-height:66px;flex:1}
#dlg .nx{position:absolute;left:12px;bottom:6px;font-size:12px;color:#7d6338;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#dlg .chs{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.cbtn{background:#c9b06e;border:2px solid #5a4226;color:var(--ink);padding:3px 14px;font-family:var(--font);font-size:15px;text-align:right;cursor:pointer;border-radius:2px;pointer-events:auto}
.cbtn:hover{background:#e6c978}
/* panels */
.scrim{position:absolute;inset:0;background:rgba(8,5,2,.72);display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:auto;animation:fIn .25s}
@keyframes fIn{from{opacity:0}}
.panel{background:linear-gradient(#efe0b8,#dbc592);color:var(--ink);border:5px solid #3a2814;outline:2px solid #b99d62;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,.85);padding:18px 24px;position:relative;max-height:660px;overflow:auto;direction:rtl}
.panel h2{margin:0 0 10px;font-size:26px;color:var(--rust2);font-weight:900;border-bottom:2px solid #8e7440;padding-bottom:4px}
.panel h3{margin:10px 0 4px;font-size:16px;color:#5a3a18}
.panel .sub{color:#6b5230;font-size:13px}
.btn{font-family:var(--font);background:linear-gradient(#c04a2c,#8a2a14);color:#fbe9bf;border:2px solid #3a1408;padding:6px 18px;font-size:16px;font-weight:700;cursor:pointer;border-radius:3px;box-shadow:0 3px 0 #3a1408;transition:transform .08s;pointer-events:auto}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a1408}
.btn.alt{background:linear-gradient(#c9b06e,#a58a48);color:var(--ink);border-color:#4a3418;box-shadow:0 3px 0 #4a3418}
.btn[disabled]{opacity:.45;cursor:default;filter:grayscale(.6)}
.btn.sm{padding:2px 12px;font-size:14px}
.menu{display:flex;flex-direction:column;gap:8px;min-width:280px}
.x{position:absolute;left:10px;top:8px;font-size:24px;cursor:pointer;color:#5a3a18;line-height:1;pointer-events:auto;background:none;border:0;font-family:var(--font)}
.x:hover{color:var(--rust)}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:3px solid #8e7440}
.tab{padding:3px 18px;background:#c9b06e;border:2px solid #5a4226;border-bottom:0;cursor:pointer;font-weight:700;border-radius:3px 3px 0 0;font-size:15px;pointer-events:auto}
.tab.on{background:#efe0b8;color:var(--rust2)}
.row{display:flex;align-items:center;gap:12px;padding:5px 6px;border-bottom:1px dashed #a58a48}
.row canvas{width:28px;height:28px;flex:none}
.row .nm2{flex:1;font-weight:700}.row .ds{font-size:12px;color:#6b5230;font-weight:400}
.row .pr{width:70px;text-align:center;font-weight:900;color:#2f5a1a;direction:ltr}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.stat{display:flex;justify-content:space-between;border-bottom:1px dotted #a58a48;padding:2px 0}
.stat b{direction:ltr}
.sl{display:flex;align-items:center;gap:12px;margin:6px 0}
.sl label{width:120px;font-weight:700}
.sl input[type=range]{flex:1;accent-color:#a8381f}
select{font-family:var(--font);padding:2px 8px;background:#e6d4a4;border:2px solid #5a4226;color:var(--ink);font-size:14px}
.cardx{background:rgba(255,248,224,.5);border:2px solid #7d6338;padding:8px 12px;margin:6px 0;border-radius:3px;display:flex;gap:12px;align-items:center}
.cardx .t{flex:1}.cardx .t b{font-size:17px;color:var(--rust2)}
.tag{display:inline-block;padding:0 10px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid #5a4226}
.tag.ok{background:#8dbb62}.tag.bad{background:#e2604a;color:#fff}.tag.act{background:#e5b44f}
/* title */
#title{position:absolute;inset:0;z-index:25;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,rgba(20,10,4,.0) 20%,rgba(10,5,2,.75) 100%)}
#title .lg{font-family:var(--logo);font-size:104px;color:#f3dfa0;text-shadow:0 4px 0 #7d2414,0 8px 0 #2a0e06,0 0 40px rgba(240,160,60,.5);letter-spacing:4px;line-height:1;direction:ltr;text-align:center}
#title .lg small{display:block;font-size:44px;color:#e8b250;letter-spacing:14px;margin-top:6px}
#title .ps{font-size:20px;color:var(--paper);margin:14px 0 26px;text-shadow:0 2px 0 #000,0 0 10px #000;letter-spacing:.5px}
#title .menu{pointer-events:auto;min-width:300px}
#title .ft{position:absolute;bottom:14px;font-size:12px;color:var(--mute);text-shadow:0 1px 0 #000;direction:rtl}
#title .btn{font-size:20px;padding:8px 22px}
/* misc screens */
.card{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:40;pointer-events:auto;animation:fIn 1s}
.card .c1{font-family:var(--logo);font-size:34px;color:var(--gold2);letter-spacing:6px;direction:ltr}
.card .c2{font-size:70px;font-weight:900;color:#f3dfa0;margin:6px 0;text-shadow:0 0 30px rgba(240,160,60,.5)}
.card .c3{font-size:20px;color:var(--mute)}
.card.dead{background:radial-gradient(ellipse at center,rgba(70,6,2,.85),rgba(10,0,0,.96))}
.card.dead .c2{color:#e0452c;font-size:96px}
.card .menu{margin-top:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv .k{text-align:left}
.cl{display:flex;gap:8px;align-items:center;margin:3px 0}
#rot{display:none}
@media (pointer:coarse){#rot{display:block;position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#7d2414;color:#fff;padding:4px 14px;border-radius:3px;font-size:13px;z-index:60;pointer-events:none}}

.hud.cine>*:not(#duel):not(#hToasts){opacity:0!important;transition:opacity .3s}

/* ---------------- touch controls ---------------- */
.tc{display:none;position:absolute;inset:0;pointer-events:none;z-index:12;direction:ltr}
#app.touch .tc{display:block}
.tc:not(.show) .tc-zone,.tc:not(.show) .tc-btn,.tc:not(.show) .tc-base,.tc:not(.show) .tc-knob{display:none}
.tc-zone{position:absolute;pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}
.tc-l{left:0;top:300px;width:560px;height:420px}
.tc-r{right:0;top:410px;width:560px;height:310px}
.tc-base{position:absolute;width:140px;height:140px;border-radius:50%;border:2px solid rgba(242,226,176,.22);background:radial-gradient(circle,rgba(20,12,6,.18) 0%,rgba(20,12,6,.34) 100%);pointer-events:none;transition:opacity .15s;opacity:.55}
.tc-base.act{opacity:1;border-color:rgba(242,226,176,.55)}
.tc-knob{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(214,176,98,.55);border:2px solid rgba(251,233,191,.7);box-shadow:0 2px 8px rgba(0,0,0,.5);pointer-events:none;opacity:.6}
.tc-knob.act{opacity:1;background:rgba(224,188,108,.85)}
.tc-btn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:2px solid rgba(90,66,38,.9);background:rgba(28,18,10,.62);color:#f2e2b0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-family:var(--font);-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none;-webkit-user-select:none}
.tc-btn b{font-size:22px;line-height:1;font-weight:900}
.tc-btn i{font-style:normal;font-size:10px;line-height:1.1;opacity:.8;margin-top:2px}
.tc-btn.big b{font-size:34px}.tc-btn.big i{font-size:12px}
.tc-btn.big{background:rgba(140,50,24,.7);border-color:#3a1408}
.tc-btn.hot{box-shadow:0 0 0 3px rgba(255,214,120,.9),0 0 18px rgba(255,200,90,.7);background:rgba(190,70,34,.9)}
.tc-btn.dn{transform:scale(.92);background:rgba(214,176,98,.75);color:#2a1808}
.tc-portrait{display:none;position:fixed;inset:0;z-index:100;background:#120a05;color:#f2e2b0;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 28px;text-align:center;font-family:var(--font);direction:rtl}
.tc-portrait.show{display:flex}
.tc-portrait .ic{font-size:72px;line-height:1;color:#d6b062;animation:tcRot 2.4s ease-in-out infinite}
.tc-portrait .t1{font-size:24px;font-weight:900}
.tc-portrait .t2{font-size:14px;line-height:1.8;opacity:.8;max-width:420px}
@keyframes tcRot{0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}

</style>
<div id="app"><div id="stage"><canvas id="cv" width="1280" height="720"></canvas><div id="ui"></div></div></div>
<script>
/* ---- 01-core.js ---- */
/* ============================================================
   DUSTY HOLLOW — core: constants, math, input, save, sound
   ============================================================ */
const TILE = 32, MW = 150, MH = 110, WW = MW * TILE, WH = MH * TILE;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const rotToward = (a, b, m) => { const d = angDiff(a, b); return Math.abs(d) <= m ? b : a + Math.sign(d) * m; };
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const chance = (p) => Math.random() < p;
const fa = (n) => String(n).replace(/\d/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]);
const el = (id) => document.getElementById(id);

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------------- Input ---------------- */
const Input = {
  keys: {}, pressed: {}, released: {}, mx: 0, my: 0, mb: [false, false, false], mpress: [false, false, false], mrel: [false, false, false], wheel: 0, enabled: true,
  down(c) { return !!this.keys[c]; },
  hit(c) { return !!this.pressed[c]; },
  endFrame() { this.pressed = {}; this.released = {}; this.mpress = [false, false, false]; this.mrel = [false, false, false]; this.wheel = 0; },
  clear() { this.keys = {}; this.mb = [false, false, false]; },

const GAME_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'ShiftLeft', 'ShiftRight']);
function installInput(canvas) {
  window.addEventListener('keydown', (e) => {
    if (GAME_KEYS.has(e.code) && !(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) e.preventDefault();
    if (e.repeat) return;
    Input.keys[e.code] = true; Input.pressed[e.code] = true;
    if (window.DH && DH.onFirstInput) DH.onFirstInput();
  });
  window.addEventListener('keyup', (e) => { Input.keys[e.code] = false; Input.released[e.code] = true; });
  window.addEventListener('blur', () => Input.clear());
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  const upd = (e) => { const r = canvas.getBoundingClientRect(); Input.mx = (e.clientX - r.left) / r.width; Input.my = (e.clientY - r.top) / r.height; };
  window.addEventListener('mousemove', upd);
  canvas.addEventListener('mousedown', (e) => { upd(e); if (e.button < 3) { Input.mb[e.button] = true; Input.mpress[e.button] = true; } if (window.DH && DH.onFirstInput) DH.onFirstInput(); });
  window.addEventListener('mouseup', (e) => { if (e.button < 3) { Input.mb[e.button] = false; Input.mrel[e.button] = true; } });
  canvas.addEventListener('wheel', (e) => { Input.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
}

})();

    X.strokeStyle = 'rgba(60,36,12,.25)'; X.lineWidth = 1; for (let i = 1; i < 10; i++) { X.beginPath(); X.moveTo(i * 88, 0); X.lineTo(i * 88, 640); X.moveTo(0, i * 64); X.lineTo(880, i * 64); X.stroke(); }

/* ============================================================

  const T = { on: false, built: false, root: null, L: null, R: null, btns: {}, portrait: null, hintShown: false };

  const BTN = [
    // [id, label, caption, key | fn, x(right), y(top), size, cls]
    ['act', 'E', 'تعامل', 'KeyE', 24, 196, 82, 'big'],
    ['roll', '⤺', 'غلت', 'Space', 118, 206, 62, ''],
    ['rel', 'R', 'پر کردن', 'KeyR', 24, 288, 52, ''], ['de', 'Q', 'دَدآی', 'KeyQ', 84, 288, 52, ''], ['drw', 'G', 'غلاف', 'KeyG', 144, 288, 52, ''], ['whi', 'H', 'سوت', 'KeyH', 204, 288, 52, ''], ['cyc', '⇄', 'اسلحه', () => { Input.wheel += 1; }, 264, 288, 52, ''],
    ['ton', 'T', 'تونیک', 'KeyT', 24, 346, 52, ''], ['food', 'B', 'خوراک', 'KeyB', 84, 346, 52, ''], ['inv', '☰', 'کوله', 'Tab', 144, 346, 52, ''], ['map', 'M', 'نقشه', 'KeyM', 204, 346, 52, ''], ['pau', '❚❚', 'مکث', 'Escape', 264, 346, 52, ''],

    T.L = stick(lz, 'L'); T.R = stick(rz, 'R');
    for (const [id, lab, cap, act, rx, ty, sz, cls] of BTN) {
      const b = el('button', 'tc-btn ' + cls, root); b.style.right = rx + 'px'; b.style.top = ty + 'px'; b.style.width = b.style.height = sz + 'px'; b.innerHTML = `<b>${lab}</b><i>${cap}</i>`; b.setAttribute('type', 'button'); T.btns[id] = b;

    pn.innerHTML = '<div class="ic">⟲</div><div class="t1">گوشی را افقی بگیرید</div><div class="t2">دره‌ی خاکی در حالت عمودی خیلی کوچک دیده می‌شود. برای تجربه‌ی بهتر دستگاه را بچرخانید؛ در حالت تمام‌صفحه بازی بهتر است.</div><button class="btn" type="button">ادامه در حالت عمودی</button>';

  }

  T.checkPortrait = () => { if (!T.portrait) return; const small = Math.min(innerWidth, innerHeight) < 700; const por = innerHeight > innerWidth * 1.05; T.portrait.classList.toggle('show', !!(T.on && small && por && !T.dismissed)); if (!por) T.dismissed = false; };

      Input.mx = clamp(px + ux * 320 / VW, 0.02, 0.98); Input.my = clamp(py + uy * 320 / VH, 0.02, 0.98);
      const aim = true, fire = rm > 0.55; if (aim !== T._aim) { T._aim = aim; Input.mb[2] = aim; if (aim) Input.mpress[2] = true; else Input.mrel[2] = true; }
      if (fire !== T._fire) { T._fire = fire; Input.mb[0] = fire; if (fire) Input.mpress[0] = true; else Input.mrel[0] = true; }
    } else { if (T._aim) { T._aim = false; Input.mb[2] = false; Input.mrel[2] = true; } if (T._fire) { T._fire = false; Input.mb[0] = false; Input.mrel[0] = true; } }

    T.btns.act.classList.toggle('hot', !!G.interact);
  };
  T.init = () => { window.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch' && !T.on) T.enable(true); }, { passive: true }); let coarse = false; try { coarse = window.matchMedia('(pointer: coarse)').matches || ((navigator.maxTouchPoints || 0) > 0 && !window.matchMedia('(hover: hover)').matches); } catch (_) { /* ignore */ } if (coarse) T.enable(true); };

})();

/* ============================================================
   DUSTY HOLLOW — boot, main loop, test API
   ============================================================ */
const DH = { cam: G.cam, errors: [], booted: false, k: 1, quality: 1, frames: 0, fps: 60, fpsAcc: 0, fpsN: 0, manual: false };
window.DH = DH;
window.addEventListener('error', (e) => { DH.errors.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
window.addEventListener('unhandledrejection', (e) => { DH.errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });

window.TouchCtl = TouchCtl;
DH.fit = function () {
  const k = Math.min(innerWidth / VW, innerHeight / VH); DH.k = k; el('stage').style.transform = `scale(${k})`; DH.applyScale();
};
DH.applyScale = function () {

};
DH.setQuality = function (q) { DH.quality = q; if (DH.booted) DH.applyScale(); };

DH.onFirstInput = function () { if (!Sound.ready) { try { Sound.init(); UI.applyPrefs(); } catch (e) { DH.errors.push('sound: ' + e.message); } } };

DH.reset = function (regen) {
  UI.closeAll(); UI.dlg = null; if (UI.dlgEl) UI.dlgEl.classList.remove('show');
  if (regen) { World.gen(); UI.buildMap(); }
  G.ents = []; G.items = []; G.bullets = []; G.misc = []; G.lights = []; G.train = null; World.dyn = []; World.dynSolid = true; Parts.list.length = 0; Decals.list.length = 0;
  G.flags = { hints: G.flags.hints && !regen ? G.flags.hints : {} }; G.stats = { kills: 0, shots: 0, hits: 0, animals: 0, deaths: 0, crimes: 0, nuggets: 0 }; G.lawAlert = 0; G.lawSeen = 0; G.posseT = 0; G.bounties = {}; G.nuggets = {}; G.playTime = 0; G.day = 1; G.time = 7.0; G.trainTimer = 120; G.deT = 0; G.deadeye = 0; G.tsT = 1; G.ts = 1; G.hurtFx = 0; G.lowHp = 0; G.waypoint = null; G.interact = null; G.hold = 0; G.holdTarget = null; G.townShots = 0; G.t = 0; G.letterT = 0; G.letterbox = 0; G.zoneDark = 0; G.dyT = 0;
  Object.assign(G.weather, { type: 'clear', rain: 0, storm: 0, fog: 0, dust: 0, cloud: 0.15, wind: 0.1, flash: 0, tRain: 0, tStorm: 0, tFog: 0, tDust: 0, tCloud: 0.15, next: 90 });
  G.cam.focus = null; G.cam.shake = 0; G.cam.zoom = 1;
  Story.ch = 0; Story.si = 0; Story.started = false; Story.S = {}; Story.obj = null; UI.objText = ''; Side.spots = null; Side.evT = 60; G.discovered = new Uint8Array(MW * MH); G.player = newPlayer(); spawnPersistent(); ensureHorse();
  UI.revealAround(World.px('ranch').x, World.px('ranch').y, 14); UI.revealAround(World.px('town').x, World.px('town').y, 20); UI.updateFog(); UI.seenHints = G.flags.hints; G.cam.snap = true; Input.clear();
  const P = G.player; G.cam.x = P.x - VW / 2; G.cam.y = P.y - VH / 2;

DH.newGame = function () {
  Sound.init(); UI.hideTitle(); Save.clear(); DH.reset(false); G.flags.hints = {}; UI.applyPrefs(); G.mode = 'card'; G.cam.snap = true;
  UI.chapterCard(1, CHAPTERS[0].title, CHAPTERS[0].sub, () => {
    G.mode = 'play'; UI.hint('intro', 'برای شروع، به سراغ اودسا بروید. دکمه‌ی E با افراد صحبت می‌کند');
    UI.dialog([L('narr', 'پاییز ۱۸۹۹. دره‌ی خاکی. جایی که آب از طلا ارزشمندتر است و هر کس راه‌آهن را دارد، دره را دارد.'), L('narr', 'الی مارو، پسری بی‌خانه‌ی گذشته، سه سال است در مزرعه‌ی اودسا هارتلی کار می‌کند. بدهی بانک امسال سنگین‌تر از همیشه است...')], () => { Story.start(0, 0, false); });
  });

DH.continueGame = function () { const s = Persist.latest(); if (!s) return DH.newGame(); Sound.init(); UI.hideTitle(); DH.loadSnapshot(s); };

/* ---------------- title background ---------------- */
DH.titleCam = function (dt) {
  const t = G.rt, tc = World.px('town'); G.time = 17.7 + Math.sin(t * 0.02) * 0.3; G.weather.cloud = 0.3; G.cam.focus = { x: tc.x - 500 + Math.sin(t * 0.07) * 180 + (t * 7 % 600), y: tc.y + Math.cos(t * 0.05) * 60, zoom: 1.0 }; G.cam.titleZoom = 1.0; Parts.update(dt);
  if (Math.random() < dt * 4) Parts.dust(G.cam.focus.x + rnd(-500, 500), G.cam.focus.y + rnd(-250, 250), 1);
};

/* ---------------- main loop ---------------- */
DH.tick = function (dt) {
  if (DH.god && G.player && !G.player.dead) G.player.hp = G.player.mhp;
  if (window.TouchCtl) TouchCtl.update(); UI.keys(); UI.update(dt);
  if (G.mode === 'title') DH.titleCam(dt);
  Game.update(Math.min(dt, 1 / 30)); Input.endFrame();
  if (G.mode === 'play' && G.player && !G.player.dead) { G.autosaveT -= dt; if (G.autosaveT <= 0) { G.autosaveT = 150; const busy = G.ents.some((e) => e.role === 'enemy' && !e.dead && e.state === 'combat' && dist(e.x, e.y, G.player.x, G.player.y) < 700); if (!busy && G.lawAlert <= 0 && Story.started) Persist.save('auto', 'timer'); else G.autosaveT = 20; } }
};
DH.render = function () { Rn.frame(G, G.rt); };
let _last = 0;
function loop(ts) {
  requestAnimationFrame(loop); if (DH.manual) return; const dt = Math.min(0.1, Math.max(0.001, (ts - _last) / 1000)); _last = ts;
  DH.fpsAcc += dt; DH.fpsN++; if (DH.fpsAcc >= 1) { DH.fps = DH.fpsN / DH.fpsAcc; DH.fpsAcc = 0; DH.fpsN = 0; }
  try { DH.tick(dt); DH.render(); DH.frames++; } catch (e) { DH.errors.push((e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : String(e))); if (DH.errors.length > 40) DH.errors.shift(); }
}

  if (DH.booted) return; installInput(el('cv')); World.gen(); Rn.init(el('cv'), 1); UI.build(); UI.buildMap(); UI.loadPrefs(); DH.fit(); window.addEventListener('resize', DH.fit); DH.booted = true; Input.mx = Input.my = 0.5; try { TouchCtl.init(); } catch (e) { DH.errors.push('touch: ' + e.message); } DH.reset(false); UI.applyPrefs(); UI.title(); document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play') UI.pause(); });
  requestAnimationFrame(loop);
};

/* ---------------- test API (headless playthroughs) ---------------- */
DH.step = function (n, dt, nr) { dt = dt || 1 / 60; DH.manual = true; for (let i = 0; i < n; i++) { DH.tick(dt); } if (!nr) DH.render(); };
DH.tp = function (x, y) { const P = G.player; if (P.mounted) dismount(); const s = World.freeSpot(x, y, 10); P.x = s.x; P.y = s.y; P.vx = P.vy = 0; G.cam.snap = true; };
DH.tpPoi = function (k, dx, dy) { const p = World.px(k); DH.tp(p.x + (dx || 0), p.y + (dy || 0)); };
DH.state = function () { const P = G.player; return { mode: G.mode, hp: Math.round(P.hp), money: P.money, x: Math.round(P.x), y: Math.round(P.y), time: +G.time.toFixed(2), step: G.flags.step, obj: UI.objText, ents: G.ents.length, bullets: G.bullets.length, parts: Parts.list.length, fps: Math.round(DH.fps), errors: DH.errors.slice(-5), mounted: P.mounted, bounty: P.bounty, inv: { ...P.inv }, ch: Story.ch, si: Story.si, enemies: G.ents.filter((e) => e.role === 'enemy' && !e.dead).length }; };
DH.skipDialog = function () { let n = 0; while (G.mode === 'dialog' && n++ < 60) { const D = UI.dlg; if (!D) break; const ln = D.lines[D.i]; D.typed = ln.t.length; D.done = true; if (ln.ch && ln.ch.length) UI.dlgChoose(0); else UI.dlgNext(); } };
DH.press = function (code) { Input.pressed[code] = true; Input.keys[code] = true; };
DH.release = function (code) { Input.keys[code] = false; };
DH.nan = function () { const bad = []; for (const e of G.ents) if (!isFinite(e.x) || !isFinite(e.y) || !isFinite(e.hp)) bad.push(e.name || e.type); return bad; };


(function () {
  let done = false; const once = () => { if (done) return; done = true; DH.boot(); };
  if (window.__DH_NOWAIT) { once(); return; }
  try { Promise.all([document.fonts.load('400 16px Vazirmatn', 'سلام'), document.fonts.load('700 16px Vazirmatn', 'سلام'), document.fonts.load('16px Rye', 'DUSTY')]).then(once, once); } catch (e) { once(); }
  setTimeout(once, 3000);
})();
