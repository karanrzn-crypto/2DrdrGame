<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coppergate — دروازهٔ مسی</title>
  <style>
    @font-face {
      font-family: 'Vazirmatn';
      src: url('./fonts/Vazirmatn-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #14100b;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas { image-rendering: pixelated; }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c9a86a;
      font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
      font-size: 22px;
      letter-spacing: 1px;
      background: #14100b;
      z-index: 10;
      transition: opacity .6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loading">در حال آماده‌سازی شهر…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
