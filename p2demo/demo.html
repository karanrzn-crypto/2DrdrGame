<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 2 — Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: system-ui, sans-serif; }
      #game { position: fixed; inset: 0; overflow: hidden; background: #000; }
      #engine-error { position: fixed; z-index: 10; top: 3rem; left: 50%; transform: translateX(-50%); width: min(40rem, calc(100% - 2rem)); box-sizing: border-box; padding: 1.5rem; border: 1px solid #c55; border-radius: 8px; background: #2a1414; }
      #engine-error[hidden] { display: none; }
      #engine-error h1 { margin-top: 0; font-size: 1.25rem; }
      #help {
        position: fixed; z-index: 5; bottom: 0.6rem; left: 50%; transform: translateX(-50%);
        display: flex; gap: 0.9rem; flex-wrap: wrap; justify-content: center;
        max-width: calc(100% - 1.5rem); box-sizing: border-box;
        padding: 0.45rem 0.9rem; border-radius: 8px; border: 1px solid #444;
        background: rgba(15, 15, 15, 0.82); font-size: 0.82rem; pointer-events: none;
      }
      #help span { white-space: nowrap; }
      #help b { color: #e2b878; font-family: ui-monospace, monospace; direction: ltr; unicode-bidi: embed; }
    </style>
    <script type="module" crossorigin src="./assets/demo-DLMbKs-g.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/KeyboardEnvironment-COp096zU.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="engine-error" role="alert" hidden></div>
    <div id="help" dir="rtl">
      <span>حرکت: <b>WASD</b> / جهت‌نما</span>
      <span>دویدن: <b>Shift</b></span>
      <span>زوم: <b>C</b></span>
      <span>لرزش: <b>Space</b></span>
      <span>ضربه: <b>K</b></span>
      <span>محو: <b>E</b></span>
      <span>توقف: <b>Esc</b></span>
    </div>
    <noscript>This game needs JavaScript enabled.</noscript>
  </body>
</html>
